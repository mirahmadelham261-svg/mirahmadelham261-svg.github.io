<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mir Ahmad Elham | Professional Profile</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#26324a,#090b12 60%);color:#fff;display:flex;justify-content:center;align-items:center;padding:25px}
.card{width:min(680px,100%);padding:42px 28px;border:1px solid #ffffff33;border-radius:28px;background:#ffffff0d;backdrop-filter:blur(14px);box-shadow:0 25px 70px #0008;text-align:center;overflow:hidden}
.logo{width:95px;height:95px;border-radius:50%;margin:auto;display:grid;place-items:center;border:2px solid #d9b86c;background:#111827;font-size:36px;color:#d9b86c;animation:pulse 2.5s infinite}
h1{margin:22px 0 8px;font-size:clamp(30px,7vw,50px);letter-spacing:2px}
.welcome{color:#d9b86c;font-size:18px;margin-bottom:30px}
.line{height:1px;background:linear-gradient(90deg,transparent,#d9b86c,transparent);margin:22px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;text-align:left}
.item{padding:16px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff08}
.item b{display:block;color:#d9b86c;margin-bottom:7px}
button{margin-top:28px;padding:13px 22px;border:1px solid #d9b86c;border-radius:30px;background:transparent;color:#fff;cursor:pointer}
button:hover{background:#d9b86c;color:#111}
.fade{animation:fade 1.2s ease both}
@keyframes fade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 30px #d9b86c55}}
</style>
</head>
<body>
<div class="card fade">
  <div class="logo">ME</div>
  <h1>Mir Ahmad Elham</h1>
  <div class="welcome">Welcome to Mir Ahmad Elham Information</div>
  <div class="line"></div>
  <div class="grid">
    <div class="item"><b>Education</b>High School • Accounting • English • Computer</div>
    <div class="item"><b>Professional Experience</b>Financial & Administrative Management — 2 Years</div>
    <div class="item"><b>Skills</b>Python • SQL & Database • Computer • Canva • Video Editing</div>
    <div class="item"><b>Languages</b>Pashto • Dari • English</div>
  </div>
  <button onclick="speakWelcome()">🔊 Play Welcome Voice</button>
</div>
<script>
function speakWelcome(){
  const text="Welcome to Mir Ahmad Elham Information.";
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US"; u.rate=.9; u.pitch=1;
    speechSynthesis.speak(u);
  }else alert("Voice is not supported by this browser.");
}
</script>
</body>
</html>
